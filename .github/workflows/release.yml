name: Release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  # npm の Trusted Publishing（OIDC）で ID トークンを取るために必要。
  # これが無いと npm CLI は OIDC を試さずに黙って通常の認証へ落ちる。
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # main のコミットメッセージ（Conventional Commits）からリリース PR を作り、
      # その PR がマージされたら release_created を立ててタグと GitHub Release を作る。
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          # ビルトインの GITHUB_TOKEN で作った PR には CI が走らない。main は
          # 5 つの必須チェックで保護されているので、チェックが埋まらないまま
          # マージできなくなる。write 権限を持つユーザーの PAT なら通常の PR と
          # 同じように CI が走る。fine-grained トークンは push に失敗する報告が
          # あるため classic PAT（repo スコープ）を使う。未設定でもリリース自体は
          # 止まらないよう GITHUB_TOKEN にフォールバックする。
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # ここから下はリリース PR がマージされたときだけ走る。
      # publish 前の lint / typecheck / build / test は prepublishOnly が行う。
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
