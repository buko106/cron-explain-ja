name: Release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # checkout が .git/config に埋める http.extraheader は、changesets@v1 が
      # ~/.netrc に書くトークンより優先される。PAT をここで渡さないと push だけが
      # ビルトイン GITHUB_TOKEN（bot）名義になり、Version PR の CI が承認待ちで止まる。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      # @changesets/cli 3.x は module.enableCompileCache() を使うため Node 22.11+ が必要。
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      # publish されるのは dist だけなので、prepublishOnly 任せにせず
      # ここで必ず作っておく（ライフサイクルが走らない経路への保険）。
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # ビルトインの GITHUB_TOKEN で push すると、Version PR の CI が
          # 承認待ち（action_required）で止まる。承認前の run は check run を
          # 作らないため必須チェックが埋まらず、ブランチ保護でマージできない。
          # write 権限を持つユーザーの PAT で push すればアクターがそのユーザーに
          # なり、承認ゲートの対象から外れて CI がそのまま走る。
          # fine-grained トークンは changesets のアクションで push に失敗する
          # 報告があるため classic PAT（repo スコープ）を使う。
          # RELEASE_TOKEN 未設定でもリリース自体は従来どおり動くようフォールバックする。
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # setup-node の registry-url は NPM_CONFIG_USERCONFIG を設定するので、
          # npm は changesets が書く ~/.npmrc ではなくそちらを読む。その .npmrc の
          # トークンは NODE_AUTH_TOKEN を参照しており、未設定だとプレースホルダ
          # （XXXXX-XXXXX-XXXXX-XXXXX）のままで publish が E404 になる。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
