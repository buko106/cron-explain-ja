name: Release
on:
  push: { branches: [main] }
  # publish せずに OIDC の交換だけを試す oidc-check ジョブ用。
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  # npm の Trusted Publishing（OIDC）で ID トークンを取るために必要。
  # これが無いと npm CLI は OIDC を試さずに黙って通常の認証へ落ちる。
  id-token: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # checkout は .git/config に http.extraheader を埋めるため、git CLI での
      # push はそのトークン名義になる。v2 は既定で GitHub API 経由で push するので
      # 通常はここに依存しないが、push-with-git-cli を有効にした場合に bot 名義に
      # 戻らないよう PAT を渡しておく。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      # @changesets/cli 3.x は module.enableCompileCache() を使うため Node 22.11+ が必要。
      # registry-url は指定しない。指定すると setup-node が
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} を書いた .npmrc を
      # userconfig に設定するので、OIDC が効かなかったときにプレースホルダの
      # トークンで publish され、認証失敗が 404 になって原因を見失う。
      # 既定のレジストリは registry.npmjs.org なので、publish 先は指定しなくても同じ。
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Trusted Publishing は npm CLI 11.5.1 以上でしか動かず、Node 22 同梱の npm は
      # 10 系なので入れ替える。changeset publish が呼ぶのは pnpm publish だが、
      # pnpm は publish 本体を node と同じディレクトリの npm（無ければ PATH 上の npm）へ
      # 委譲するため、ここで入れ替えた npm がそのまま使われる。pnpm 自体は OIDC を
      # 実装していないので、この差し替えが OIDC を効かせる唯一の経路になる。
      #
      # 12 系にはできない。pnpm 9 は自分専用のフラグ（--no-git-checks）もそのまま npm へ
      # 渡すが、npm 12 は未知のフラグを EUNKNOWNCONFIG で撥ねる（11 は警告のみで通す）。
      # 12 に上げるなら、委譲前にフラグを落とす pnpm 10 以上へ先に揃えること。
      - run: |
          npm install --global "npm@^11.5.1"
          npm --version
      - run: pnpm install --frozen-lockfile
      # publish されるのは dist だけなので、prepublishOnly 任せにせず
      # ここで必ず作っておく（ライフサイクルが走らない経路への保険）。
      - run: pnpm build
      # v1 は publish の出力から "New tag:" の行を探して公開を検知するが、
      # @changesets/cli 3.x はその形式で出力しないため、タグの push も
      # GitHub Release の作成も飛ばされていた。v2 は NDJSON のファイル経由で
      # 結果を受け取るのでこの取りこぼしが起きない。
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          # ビルトインの GITHUB_TOKEN で PR を作ると、その PR の CI が承認待ち
          # （action_required）で止まる。承認前の run は check run を作らないため
          # 必須チェックが埋まらず、ブランチ保護でマージできない。write 権限を
          # 持つユーザーの PAT を使えば承認ゲートの対象から外れる。
          # fine-grained トークンは push に失敗する報告があるため classic PAT
          # （repo スコープ）を使う。未設定でもリリースが止まらないよう
          # GITHUB_TOKEN にフォールバックする。
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # trusted publisher の登録を、publish せずに確かめるための手動実行ジョブ。
  # npm publish は --dry-run でも OIDC の交換まで進むので、その結果だけを見る。
  # 交換の可否はワークフローのファイル名に紐づくため、確認は release.yml の中から
  # 行う必要がある（別ファイルに切り出すと job_workflow_ref が変わって落ちる）。
  oidc-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: |
          npm install --global "npm@^11.5.1"
          npm --version
      - run: pnpm install --frozen-lockfile
      # files に dist しか入れていないので、pack できるよう先に作る
      - run: pnpm build
      - name: OIDC の交換だけ試す
        run: |
          # 公開済みバージョンとの衝突で最後は必ず失敗するが、交換はその手前で終わっている
          npm publish --dry-run --ignore-scripts --loglevel verbose > oidc.log 2>&1 || true
          # oidc の行だけ出す。トークンの値はログに出ない
          grep -i "oidc" oidc.log || echo "(oidc のログ行が無い: npm のバージョンか id-token 権限を確認)"
          if grep -q "oidc Successfully retrieved and set token" oidc.log; then
            echo "OK: trusted publisher は登録済み（OIDC トークンを交換できた）"
          else
            echo "NG: OIDC トークンを交換できなかった。npmjs.com の trusted publisher 設定を確認すること"
            exit 1
          fi
