name: Release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # checkout は .git/config に http.extraheader を埋めるため、git CLI での
      # push はそのトークン名義になる。v2 は既定で GitHub API 経由で push するので
      # 通常はここに依存しないが、push-with-git-cli を有効にした場合に bot 名義に
      # 戻らないよう PAT を渡しておく。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      # @changesets/cli 3.x は module.enableCompileCache() を使うため Node 22.11+ が必要。
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      # publish されるのは dist だけなので、prepublishOnly 任せにせず
      # ここで必ず作っておく（ライフサイクルが走らない経路への保険）。
      - run: pnpm build
      # v1 は publish の出力から "New tag:" の行を探して公開を検知するが、
      # @changesets/cli 3.x はその形式で出力しないため、タグの push も
      # GitHub Release の作成も飛ばされていた。v2 は NDJSON のファイル経由で
      # 結果を受け取るのでこの取りこぼしが起きない。
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          # ビルトインの GITHUB_TOKEN で PR を作ると、その PR の CI が承認待ち
          # （action_required）で止まる。承認前の run は check run を作らないため
          # 必須チェックが埋まらず、ブランチ保護でマージできない。write 権限を
          # 持つユーザーの PAT を使えば承認ゲートの対象から外れる。
          # fine-grained トークンは push に失敗する報告があるため classic PAT
          # （repo スコープ）を使う。未設定でもリリースが止まらないよう
          # GITHUB_TOKEN にフォールバックする。
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # setup-node の registry-url は NPM_CONFIG_USERCONFIG を設定するので、
          # npm は changesets が書く ~/.npmrc ではなくそちらを読む。その .npmrc の
          # トークンは NODE_AUTH_TOKEN を参照しており、未設定だとプレースホルダ
          # （XXXXX-XXXXX-XXXXX-XXXXX）のままで publish が E404 になる。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
