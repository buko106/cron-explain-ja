name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # 開発ツールチェーン（vitest 5 / rolldown）が Node 22.12+ を要求するため、
  # ここでは Node 22 以降のみをテストする。
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: node dist/cli.js --version
      # デモページ（site/）はライブラリ本体を直接 import しているので、
      # main へマージしたあとの Pages デプロイではなく PR の段階で壊れを検知する
      - run: pnpm build:site

  # package.json の engines (>=18.3) を裏付けるジョブ。
  # ビルドは Node 22 で行い、成果物だけを古い Node で実行して動作を確認する。
  runtime-compat:
    name: runtime (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [18, 20] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: node --version
      - run: node dist/cli.js --version
      - run: node -e "import(require('node:url').pathToFileURL('dist/index.js').href).then(() => console.log('esm ok'))"
      - run: node --input-type=commonjs -e "require('./dist/index.cjs'); console.log('cjs ok')"
      # 古い Node では Intl の挙動が違いうるが vitest は動かせないので、
      # タイムゾーンの変換だけここでスモークする
      - name: timezone smoke
        run: |
          node --input-type=commonjs -e "
            const { explain, parse } = require('./dist/index.cjs');
            const check = (actual, expected, label) => {
              if (actual !== expected) {
                throw new Error(label + ': ' + actual + ' (expected ' + expected + ')');
              }
            };
            check(parse('毎日午後1時').expression, '0 4 * * *', 'parse 既定(Asia/Tokyo) → UTC');
            check(parse('毎日午後1時', { tz: 'UTC' }).expression, '0 13 * * *', 'parse tz=UTC');
            check(explain('0 4 * * *'), '毎日午後1時', 'explain 既定(UTC → Asia/Tokyo)');
            check(explain('0 9 * * *', { tz: 'UTC' }), '毎日午前9時', 'explain tz=UTC');
            check(explain('0 20 * * 1'), '毎週火曜日の午前5時', 'explain 日またぎ');
            console.log('timezone ok');
          "
